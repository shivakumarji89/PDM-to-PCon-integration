name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run test suite
        shell: bash
        run: |
          status=0
          python -m pytest -q -rf 2>&1 | tee pytest.log || status=$?
          # Surface failed test ids as annotations (logs are not readable without signing in).
          grep -E '^(FAILED|ERROR) ' pytest.log | head -50 | while read -r line; do echo "::error title=pytest::${line}"; done || true
          exit $status
