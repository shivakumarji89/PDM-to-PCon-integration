name: Maintenance Pricing Parity Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/pdm_differential/**"
      - "services/legacy_pricing_engine.py"
      - "services/pricing_service.py"
      - "services/price_text_blocks.py"
      - "services/price_mdb_export_service.py"
      - "repositories/pdm_repository.py"
      - "models/price_record.py"
      - "ui/pages/pricing_page.py"
      - "tests/test_legacy_pricing_engine.py"
      - "tests/test_pdm_differential_fetch_routing.py"
      - "tests/test_global_price_source_parity.py"
      - "tests/test_pdm_price_fetch_parity.py"
      - "tests/test_pdm_differential_report.py"
      - "tests/test_price_mdb_export_service.py"
      - "tests/test_pricing_pdm_text_parity.py"
      - "tests/test_price_list_service.py"
      - "tests/test_price_list_targets.py"
      - "tests/test_price_product_code.py"
      - "tests/test_pricing_page_text_blocks.py"
      - "tests/test_pricing_export_workflow.py"
      - ".github/workflows/maintenance-pricing-parity.yml"
  workflow_dispatch:

jobs:
  pricing-parity:
    name: Maintenance pricing and parity regression tests
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run Maintenance pricing and parity tests
        run: |
          python -m pytest -q \
            tests/test_legacy_pricing_engine.py \
            tests/test_pdm_differential_fetch_routing.py \
            tests/test_global_price_source_parity.py \
            tests/test_pdm_price_fetch_parity.py \
            tests/test_pdm_differential_report.py \
            tests/test_price_mdb_export_service.py \
            tests/test_pricing_pdm_text_parity.py \
            tests/test_price_list_service.py \
            tests/test_price_list_targets.py \
            tests/test_price_product_code.py \
            tests/test_pricing_page_text_blocks.py \
            tests/test_pricing_export_workflow.py
