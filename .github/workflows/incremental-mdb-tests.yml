name: Incremental MDB Workflow Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "services/*mdb_export_service.py"
      - "services/pricing_service.py"
      - "services/class_creation_selection_service.py"
      - "services/engineering/engineering_relation_service.py"
      - "services/engineering/engineering_text_service.py"
      - "ui/pages/pricing_page.py"
      - "ui/widgets/maintenance_source_tabs.py"
      - "ui/dialogs/varcond_generation_dialog.py"
      - "ui/main_window.py"
      - "tests/test_incremental_relation_text_export.py"
      - "tests/test_properties_values_mdb_export_service.py"
      - "tests/test_article_mdb_export_service.py"
      - "tests/test_article_mdb_export_parity.py"
      - "tests/test_class_creation_selection.py"
      - "tests/test_class_creation_mdb_export_service.py"
      - "tests/test_engineering_relation_service.py"
      - "tests/test_price_mdb_export_service.py"
      - "tests/test_pricing_export_workflow.py"
      - "tests/test_pricing_parallel_batches.py"
      - "tests/test_pricing_page_text_blocks.py"
      - "tests/test_maintenance_varcond.py"
      - ".github/workflows/incremental-mdb-tests.yml"

jobs:
  incremental-mdb:
    name: Incremental MDB and pricing regression tests
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run incremental MDB and pricing tests
        run: |
          python -m pytest -q \
            tests/test_incremental_relation_text_export.py \
            tests/test_properties_values_mdb_export_service.py \
            tests/test_article_mdb_export_service.py \
            tests/test_article_mdb_export_parity.py \
            tests/test_class_creation_selection.py \
            tests/test_class_creation_mdb_export_service.py \
            tests/test_engineering_relation_service.py \
            tests/test_price_mdb_export_service.py \
            tests/test_pricing_export_workflow.py \
            tests/test_pricing_parallel_batches.py \
            tests/test_pricing_page_text_blocks.py \
            tests/test_maintenance_varcond.py \
